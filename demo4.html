<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Bloom</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #d9f9d8;
        color: #333;
      }

      .header-image {
        width: 100%;
        height: 60vh;
        border-radius: 10px;
      }

      .card {
        background-color: #fff;
        border: 1px solid #96f39a;
        border-radius: 10px;
        text-align: center;
        padding: 10px;
        box-shadow: 0 10px 15px rgba(72, 203, 138, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 25px rgba(72, 203, 138, 0.3);
      }

      .card img {
        width: 100%;
        height: 250px;
        border-radius: 10px;
        object-fit: cover;
        margin-bottom: 10px;
      }

      .card p {
        font-size: 18px;
        font-weight: bold;
        color: #48cb8a;
      }

      .navbar {
        background-color: #48cb8a;
      }

      .navbar-brand img {
        width: 70px;
        height: 70px;
        margin-right: 10px;
      }

      .navbar-brand span {
        color: #fff;
        font-weight: bold;
        font-size: 20px;
      }

      .navbar-profile-icon {
        width: 30px;
        height: 30px;
      }

      .nav-link {
        color: #fff;
      }

      .nav-link:hover {
        color: #d9f9d8;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg shadow">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="https://cdn-icons-png.flaticon.com/512/747/747310.png" alt="Logo" />
          <span style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Health Bloom</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#">
                <img
                  src="https://cdn-icons-png.flaticon.com/512/747/747376.png"
                  alt="Profile Icon"
                  class="navbar-profile-icon"
                />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
      <div class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col">
          <a href="healthy-habits-home-page.html" style="text-decoration: none;">
            <div class="card h-100">
              <img
                src="https://i.ibb.co/mFmT574/IMG-20241214-WA0007.jpg"
                alt="Healthy Habits"
                class="card-img-top"
              />
              <div class="card-body">
                <p class="card-text">Healthy Habits</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col">
          <a href="beauty-tips-home-page.html" style="text-decoration: none;">
            <div class="card h-100">
              <img
                src="https://i.ibb.co/HDVypvb/IMG-20241213-WA0007.jpg"
                alt="Beauty Tips"
                class="card-img-top"
              />
              <div class="card-body">
                <p class="card-text">Beauty Tips</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col">
          <a href="calorie-home-page.html" style="text-decoration: none;">
            <div class="card h-100">
              <img
                src="https://i.ibb.co/SR3pWDW/harshi.webp"
                alt="Calorie Check"
                class="card-img-top"
              />
              <div class="card-body">
                <p class="card-text">Calorie Check</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col">
          <a href="seasonal-remedies-home-page.html" style="text-decoration: none;">
            <div class="card h-100">
              <img
                src="https://i.ibb.co/vsGtCZq/IMG-20241214-WA0027.jpg"
                alt="Seasonal Remedies"
                class="card-img-top"
              />
              <div class="card-body">
                <p class="card-text">Seasonal Remedies</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
